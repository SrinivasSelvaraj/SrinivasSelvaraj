  </style>
  <rect width="980" height="200" rx="18" fill="#05070D"/>
  <line x1="326.6666666666667" y1="45" x2="326.6666666666667" y2="155" stroke="#1B2330" stroke-width="1"/>
  <line x1="653.3333333333334" y1="45" x2="653.3333333333334" y2="155" stroke="#1B2330" stroke-width="1"/>

  <!-- Total contributions -->
